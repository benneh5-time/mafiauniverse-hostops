[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu-host-ops-bot"
version = "0.1.0"
description = "Standalone MafiaUniverse host operations Discord bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "requests>=2.31",
    "gspread>=6.1",
    "google-auth>=2.29",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-mock>=3.12"]

[tool.setuptools.packages.find]
include = ["host_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
